[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalper"
version = "0.1.0"
description = "Pipeline de scraping et de traduction de chapitres manga/webtoon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
agents = ["mistralai-agents>=1.1"]
ocr = ["pillow>=10.1", "pytesseract>=0.3.10"]
ocr-paddle = ["paddlepaddle>=3.0,<3.3", "paddleocr>=3.0"]  # paddlepaddle 3.3.x: bug oneDNN ConvertPirAttribute2RuntimeAttribute (Paddle#79749) -> pin <3.3
inpaint-lama = ["onnxruntime>=1.17", "numpy>=1.24"]  # inpainting LaMa (big-lama ONNX, github.com/advimman/lama) pour la suppression du texte

[project.scripts]
scalper = "scalper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scalper = ["data/demo/*"]

[tool.mistralai.agents]
entrypoint = "scalper.agents.main:agent"
